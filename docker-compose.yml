services:
  bot:
    build: .
    container_name: slack-chathistory-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/chat_history.db
      - FILES_DIR=/data/files
      - TZ=Asia/Tokyo
    volumes:
      - bot-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot-data:
