services:
  bot:
    build: .
    container_name: slack-chathistory-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/chat_history.db
      - FILES_DIR=/data/files
      - TZ=Asia/Tokyo
    volumes:
      - bot-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: slack-chathistory-backup
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Tokyo
    volumes:
      - bot-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  dbadmin:
    build:
      context: .
      dockerfile: Dockerfile.dbadmin
    container_name: slack-chathistory-dbadmin
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - bot-data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  bot-data:
